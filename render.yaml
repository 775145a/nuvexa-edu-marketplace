# Render Blueprint — deploys the Nuvexa API (backend) as a free web service.
# Usage: Render dashboard > New > Blueprint > select this repo > Apply.
services:
  - type: web
    name: nuvexa-api
    runtime: node
    repo: https://github.com/775145a/nuvexa-edu-marketplace
    branch: main
    rootDir: backend
    plan: free
    region: frankfurt
    healthCheckPath: /health
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: PAYMENT_PROVIDER
        value: mock
      - key: VAT_RATE
        value: "14"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: EMAIL_FROM
        value: noreply@nuvexa.com
      - key: EMAIL_FROM_NAME
        value: Nuvexa
      - key: REFERRAL_REWARD_PERCENT
        value: "10"
      - key: OTP_LENGTH
        value: "6"
      - key: OTP_EXPIRY_MINUTES
        value: "10"
      # Secrets — leave blank here; fill them in the Render dashboard after the
      # service is created (or set them via the Render API):
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: STORE_WALLET
        sync: false
      - key: PLATFORM_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
